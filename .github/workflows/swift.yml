name: Swift prototype

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test policy engine
        run: swift test
      - name: Build Mac planner
        run: swift build --product WeekPactApp
      - name: Compile filter prototype
        run: swift build --target WeekPactFilterPrototype
      - name: Generate and compile macOS bundle
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project WeekPact.xcodeproj -scheme WeekPactMac -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
