name: Swift prototype

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check local blocker script
        run: bash -n scripts/test-weekpact-block.sh
      - name: Test policy engine
        run: swift test
      - name: Build Mac planner
        run: swift build --product WeekPactApp
      - name: Compile filter prototype
        run: swift build --target WeekPactFilterPrototype
      - name: Generate and compile macOS bundle
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project WeekPact.xcodeproj -scheme WeekPactMac -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/WeekPactDerived" CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/WeekPactDerived/Build/Products/Debug/WeekPactMac.app/Contents/Library/SystemExtensions/com.pandeydeep9.WeekPact.Filter.systemextension"
